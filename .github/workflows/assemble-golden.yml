name: Assemble Golden OTA Firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "golden/staging-a.b64"
      - "golden/staging-b.b64"
      - ".github/workflows/assemble-golden.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify
        shell: bash
        run: |
          set -euo pipefail
          cat golden/recovery-a.b64 golden/recovery-b.b64 > /tmp/golden.b64
          base64 -d /tmp/golden.b64 > golden/firmware.bin
          BYTES=$(wc -c < golden/firmware.bin)
          SHA=$(sha256sum golden/firmware.bin | awk '{print $1}')
          echo "BYTES=$BYTES"
          echo "SHA=$SHA"
          test "$BYTES" = "1149088"
          test "$SHA" = "73dd217666df6c0c9c23571cb32939b5df2009dbe4157d2b80e519760eed1ad0"
      - name: Publish recovery manifest and firmware
        shell: bash
        run: |
          set -euo pipefail
          cat > golden/manifest.json <<'EOF'
          {
            "version": "1.0.1",
            "url": "https://raw.githubusercontent.com/Fernandodsrm/botizin-ota/main/golden/firmware.bin",
            "sha256": "73dd217666df6c0c9c23571cb32939b5df2009dbe4157d2b80e519760eed1ad0"
          }
          EOF
          git config user.name "botizin-ota-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f golden/firmware.bin golden/manifest.json
          git commit -m "Publish recovery 1.0.1 firmware and manifest" || exit 0
          git push origin HEAD:main

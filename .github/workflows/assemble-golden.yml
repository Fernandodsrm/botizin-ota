name: Assemble Golden OTA Firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "golden/staging-a.b64"
      - "golden/staging-b.b64"
      - ".github/workflows/assemble-golden.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify
        shell: bash
        run: |
          set -euo pipefail
          cat golden/staging-a.b64 golden/staging-b.b64 > /tmp/golden.b64
          base64 -d /tmp/golden.b64 > golden/firmware.bin
          BYTES=$(wc -c < golden/firmware.bin)
          SHA=$(sha256sum golden/firmware.bin | awk '{print $1}')
          echo "BYTES=$BYTES"
          echo "SHA=$SHA"
          test "$BYTES" = "1119168"
          test "$SHA" = "fb239412a4515272d77d0b40019e09bb7ec8b52847e26e50460ac2ffbb1b8d40"
      - name: Commit firmware
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "botizin-ota-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f golden/firmware.bin
          git commit -m "Publish Golden OTA 1.0.1 firmware" || exit 0
          git push origin HEAD:main
